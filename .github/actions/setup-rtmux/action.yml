name: Set up RTMux build environment
description: Install the RISC-V bare-metal toolchain, QEMU, lld and host tools.
inputs:
  qemu:
    description: Install qemu-system-riscv64 and OpenSBI (jobs that boot RTMux).
    default: 'true'
  lkl:
    description: Install the riscv64-linux-gnu cross toolchain and kernel build deps for LKL.
    default: 'false'
  formal:
    description: Install the formal-verification tools (CBMC, Spin, Z3).
    default: 'false'
  packages:
    description: Extra space-separated apt packages to install.
    default: ''
runs:
  using: composite
  steps:
    # Restore here and save right after the install below, not at the end of the
    # job: a job that later fails would otherwise never contribute its
    # downloads, and a slow mirror is where the next one starts over.
    # The runner image fixes the package versions apt will pick, so it is part
    # of the key: after an image refresh the old archive misses, and the new
    # downloads are saved instead of fetched again by every later job.
    - name: Name the runner image
      id: apt-image
      shell: bash
      run: echo "image=${ImageOS:-${{ runner.os }}}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Restore apt packages
      id: apt-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/apt-cache
        key: apt-rtmux-${{ steps.apt-image.outputs.image }}-q${{ inputs.qemu }}-l${{ inputs.lkl }}-f${{ inputs.formal }}-${{ inputs.packages }}-${{ hashFiles('.github/actions/setup-rtmux/action.yml') }}

    - name: Install packages
      shell: bash
      run: |
        mkdir -p ~/apt-cache
        pkgs="build-essential lld python3 git e2fsprogs clang-format-20"
        if [ "${{ inputs.qemu }}" = "true" ]; then
          pkgs="$pkgs qemu-system-misc opensbi ipxe-qemu"
        fi
        if [ "${{ inputs.lkl }}" = "true" ]; then
          pkgs="$pkgs gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross flex bison bc libelf-dev"
        fi
        if [ "${{ inputs.formal }}" = "true" ]; then
          pkgs="$pkgs cbmc spin z3"
        fi
        # A stalled mirror once hung `apt-get update` for the whole job timeout,
        # so bound each network attempt and retry.
        apt() {
          for attempt in 1 2 3; do
            timeout 600 sudo apt-get -o Acquire::Retries=3 \
              -o Acquire::Languages=none \
              -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false \
              -o Acquire::http::Timeout=30 "$@" && return 0
            echo "apt-get $1 attempt $attempt failed" >&2
            sleep 5
          done
          return 1
        }
        # Use the Ubuntu archive alone. The image's own sources have named a
        # mirror too slow to finish inside an attempt, lacked the archive, and
        # carried a third-party repository whose 403 failed the whole update.
        # Removing them is fine: the runner is discarded after the job.
        codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
        sudo rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*
        sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<EOF
        Types: deb
        URIs: http://archive.ubuntu.com/ubuntu/
        Suites: $codename $codename-updates $codename-security
        Components: main universe
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        EOF
        # By default a transient fetch failure only warns, and the install then
        # fails on the missing index. Fail the update so that it is retried.
        apt update --error-on=any
        install=(install -y --no-install-recommends
          -o "Dir::Cache::Archives=$HOME/apt-cache" $pkgs ${{ inputs.packages }})
        apt "${install[@]}" --download-only
        # Unpack outside the retry loop: a timeout would leave dpkg half done,
        # and every later attempt would fail on that. With no retry here, wait
        # for a busy dpkg lock; apt-get does not by default.
        sudo apt-get -o DPkg::Lock::Timeout=120 "${install[@]}" --no-download
        clang-format-20 --version | grep -Eq 'clang-format version 20([.]|$)'
        # apt ran as root, and its partial directory is not readable by the
        # runner user that saves the cache next.
        sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-cache"

    - name: Save apt packages
      if: steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/apt-cache
        key: apt-rtmux-${{ steps.apt-image.outputs.image }}-q${{ inputs.qemu }}-l${{ inputs.lkl }}-f${{ inputs.formal }}-${{ inputs.packages }}-${{ hashFiles('.github/actions/setup-rtmux/action.yml') }}

    # `make defconfig` clones Kconfiglib on first use; keep it out of the
    # critical path (and off the network) on later runs.
    - name: Cache Kconfiglib
      uses: actions/cache@v6
      with:
        path: tools/kconfig
        key: kconfiglib-${{ runner.os }}-v1

    - name: Cache xPack RISC-V toolchain
      id: tc-cache
      uses: actions/cache@v6
      with:
        path: ~/toolchains/riscv-none-elf
        key: xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64

    - name: Install xPack riscv-none-elf toolchain
      if: steps.tc-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        v=15.2.0-1
        sha=aaaa8060c914851a3e5ee1ba82cc3d6f80972f90638a05c6e823a37557a33758
        mkdir -p ~/toolchains/riscv-none-elf
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/tc.tgz" \
          "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${v}/xpack-riscv-none-elf-gcc-${v}-linux-x64.tar.gz"
        echo "$sha  $RUNNER_TEMP/tc.tgz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/tc.tgz" -C ~/toolchains/riscv-none-elf --strip-components=1
        rm -f "$RUNNER_TEMP/tc.tgz"

    - name: Export toolchain path
      shell: bash
      run: |
        echo "$HOME/toolchains/riscv-none-elf/bin" >> "$GITHUB_PATH"
        "$HOME/toolchains/riscv-none-elf/bin/riscv-none-elf-gcc" --version | head -1
