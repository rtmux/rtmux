name: Set up RTMux build environment
description: Install the RISC-V bare-metal toolchain, QEMU, lld and host tools.
inputs:
  qemu:
    description: Install qemu-system-riscv64 and OpenSBI (jobs that boot RTMux).
    default: 'true'
  lkl:
    description: Install the riscv64-linux-gnu cross toolchain and kernel build deps for LKL.
    default: 'false'
  formal:
    description: Install the formal-verification tools (CBMC, Spin, Z3).
    default: 'false'
  packages:
    description: Extra space-separated apt packages to install.
    default: ''
runs:
  using: composite
  steps:
    - name: Cache apt packages
      uses: actions/cache@v6
      with:
        path: ~/apt-cache
        key: apt-rtmux-${{ runner.os }}-q${{ inputs.qemu }}-l${{ inputs.lkl }}-f${{ inputs.formal }}-${{ inputs.packages }}-${{ hashFiles('.github/actions/setup-rtmux/action.yml') }}

    - name: Install packages
      shell: bash
      run: |
        mkdir -p ~/apt-cache
        pkgs="build-essential lld python3 git e2fsprogs"
        if [ "${{ inputs.qemu }}" = "true" ]; then
          pkgs="$pkgs qemu-system-misc opensbi"
        fi
        if [ "${{ inputs.lkl }}" = "true" ]; then
          pkgs="$pkgs gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu flex bison bc libelf-dev"
        fi
        if [ "${{ inputs.formal }}" = "true" ]; then
          pkgs="$pkgs cbmc spin z3"
        fi
        # A stalled mirror once hung `apt-get update` for the whole job timeout,
        # so bound each attempt and retry.
        apt() {
          for attempt in 1 2 3; do
            timeout 300 sudo apt-get -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@" && return 0
            echo "apt-get $1 attempt $attempt failed" >&2
            sleep 5
          done
          return 1
        }
        apt update
        apt install -y -o "Dir::Cache::Archives=$HOME/apt-cache" $pkgs ${{ inputs.packages }}

    # `make defconfig` clones Kconfiglib on first use; keep it out of the
    # critical path (and off the network) on later runs.
    - name: Cache Kconfiglib
      uses: actions/cache@v6
      with:
        path: tools/kconfig
        key: kconfiglib-${{ runner.os }}-v1

    - name: Cache xPack RISC-V toolchain
      id: tc-cache
      uses: actions/cache@v6
      with:
        path: ~/toolchains/riscv-none-elf
        key: xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64

    - name: Install xPack riscv-none-elf toolchain
      if: steps.tc-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        v=15.2.0-1
        sha=aaaa8060c914851a3e5ee1ba82cc3d6f80972f90638a05c6e823a37557a33758
        mkdir -p ~/toolchains/riscv-none-elf
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/tc.tgz" \
          "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v${v}/xpack-riscv-none-elf-gcc-${v}-linux-x64.tar.gz"
        echo "$sha  $RUNNER_TEMP/tc.tgz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/tc.tgz" -C ~/toolchains/riscv-none-elf --strip-components=1
        rm -f "$RUNNER_TEMP/tc.tgz"

    - name: Export toolchain path
      shell: bash
      run: |
        echo "$HOME/toolchains/riscv-none-elf/bin" >> "$GITHUB_PATH"
        "$HOME/toolchains/riscv-none-elf/bin/riscv-none-elf-gcc" --version | head -1
