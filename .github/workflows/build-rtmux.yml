# Build and verify RTMux.  All jobs run in parallel.
#
#   static   -- host-side gates that need no boot, run with make -j
#   formal   -- CBMC / Spin / Z3 model checks (make check-formal)
#   litmus   -- herd7 memory-model litmus tests (cached opam switch)
#   host     -- host-built unit tests of kernel/libc pieces
#   runtime  -- QEMU gates, one leg per gate so they run side by side
#   boot     -- per POSIX conformance profile (minimal / realtime / lkl / full):
#               full build + QEMU boot + syscall_testing probe; the advertised
#               option surface of every profile is checked in `static`
#
# `static` runs its gates with make -j (checked: the same list passes serially
# and in parallel).  `formal` runs one gate after another; it has only been
# verified serially.  Jobs run in parallel either way.
#
# LKL itself is covered by build-lkl.yml and lkl-qemu.yml.
# scripts/check-ci-coverage.py (run in `static`) fails when a test target in
# the Makefile is run by no workflow and has no waiver.
name: Build and Test RTMux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: rtmux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# GitHub runners are several times slower than a development host, so give
# every guest boot more time than the Makefile default.
env:
  QEMU_BOOT_TIMEOUT: '600'

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rtmux
        with:
          qemu: 'false'
      - name: Configure
        run: make defconfig
      - name: Build
        run: make -j"$(nproc)"
      - name: POSIX / ABI / contract gates
        run: |
          make -j"$(nproc)" \
               check-ci-coverage check-lkl-scripts check-make-target-names \
               check-gap-anchors \
               check-posix-matrix check-posix-matrix-strict-ignore \
               check-posix-matrix-options check-pse51 \
               check-posix-profile-header check-posix-profile-config \
               check-posix-profile-surface check-lkl-profile \
               check-syscall-abi check-libc-abi \
               check-porting-contract check-kernel-nofp check-formal-claims \
               check-gate-cert check-rt-budgets check-irq-contract \
               check-platform-boundary-contracts check-lock-rank \
               check-preempt-inventory check-assumptions \
               check-evidence-claims check-memory-safety-inventory \
               check-map-phys-inventory check-rcu-sched check-cap-v1 \
               check-trace-export check-fu740-smoke-scripts driver-gate

      # Alone, not in the parallel list above: it touches shared headers, and a
      # target compiling at the same moment would see them rebuild.
      - name: Header dependency tracking
        run: make check-header-deps

  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rtmux
        with:
          formal: 'true'
      - run: make defconfig
      - name: Formal gates
        run: make check-formal

  litmus:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rtmux
        with:
          qemu: 'false'
          packages: opam ocaml-nox libgmp-dev
      - name: Cache opam switch
        id: opam-cache
        uses: actions/cache@v6
        with:
          path: ~/.opam
          key: opam-rtmux-herd-${{ runner.os }}-herdtools7-7.58
      - name: Build herdtools7 (cache miss)
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: |
          opam init --bare -y --disable-sandboxing --no-setup
          opam switch create rtmux-herd ocaml-system -y
          eval "$(opam env --switch=rtmux-herd)"
          opam install -y herdtools7.7.58
      - run: make defconfig
      - name: Litmus gates
        run: |
          eval "$(opam env --switch=rtmux-herd)"
          make check-rcu-litmus check-ipc-litmus

  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rtmux
        with:
          qemu: 'false'
      - run: make defconfig
      - name: Host tests
        run: |
          make -j"$(nproc)" host-tests host-lkl-fence-asm \
               RISCV_CC='riscv-none-elf-gcc -march=rv64g -mabi=lp64d'

  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: realtime
            run: make check-rt
          # Non-blocking: the 8-hart guest starves on a 4 vCPU runner and has
          # stalled in ipc-contention; it passes on larger hosts.
          - name: smp-invariants
            run: make check-smp-invariants QEMU_SMP_TIMEOUT=400
            experimental: true
          - name: fault-recovery
            run: make check-fault-recovery
          - name: loader-negative
            run: make check-loader-negative
          - name: boot-manifest
            run: make check-boot-manifest
          - name: toolbox
            run: make check-toolbox
          - name: emu-headless
            run: make check-emu-headless
          - name: races
            formal: true
            run: |
              make check-channel-teardown-race check-reply-timeout-race \
                   check-debug-blocked-on check-opts-pse51
          - name: block-and-pci
            run: |
              make -j"$(nproc)" startup initramfs
              ./scripts/qemu-regress.sh --mode syscall-testing-disk --timeout 900
              ./scripts/qemu-regress.sh --mode pci-nvme-smoke --timeout 300
          - name: qemu-regress
            run: make qemu-regress
          - name: tty-smoke
            run: make tty-smoke
            experimental: true
          # Non-blocking until each has passed on shared runners: these modes are
          # timing-sensitive or slow (the realtime and IRQ modes use sub-second
          # windows, the watchdog modes stall harts on purpose, trace-modes
          # rebuilds an instrumented kernel, leak-gate runs the suite three times,
          # version-skew builds two trees). Promote each once it has been green.
          - name: rt-extra
            run: make check-rt-extra
            experimental: true
          - name: irq-modes
            run: make check-irq-modes
            experimental: true
          - name: guest-misc
            run: make check-guest-misc
            experimental: true
          - name: hart-watchdog
            run: make check-hart-watchdog
            experimental: true
          - name: trace-modes
            run: make check-trace-modes QEMU_TRACE_TIMEOUT=300
            experimental: true
          - name: leak-gate
            run: make check-leak-gate
            experimental: true
          - name: version-skew
            run: make check-version-skew
            experimental: true
    name: runtime (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rtmux
        with:
          formal: ${{ matrix.formal || 'false' }}
      - run: make defconfig
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
      - if: failure()
        uses: ./.github/actions/upload-logs
        with:
          name: runtime-logs-${{ matrix.name }}

  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, realtime, lkl, full]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rtmux
      - run: make defconfig
      - name: Boot probe (${{ matrix.profile }})
        env:
          PROBE_TIMEOUT: '900'
        run: |
          if [ "${{ matrix.profile }}" = full ]; then
            # The probe restores the full profile on exit by rebuilding it, so
            # for full itself build once and boot.
            make -j"$(nproc)"
            ./scripts/qemu-regress.sh --mode syscall-testing --timeout "$PROBE_TIMEOUT"
          else
            make posix-profile-boot-probe ARGS=${{ matrix.profile }}
          fi
      - if: failure()
        uses: ./.github/actions/upload-logs
        with:
          name: boot-logs-${{ matrix.profile }}
