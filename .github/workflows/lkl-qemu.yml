# RTMux + LKL on QEMU (riscv64).
#
#   archives -- build-lkl.yml: the RV64 fsd/netd archives from lkl/linux
#   qemu     -- one leg per LKL gate, all in parallel against those archives:
#               containment + libc floor, smoke modes, differential oracles
#               against Linux, traced latency windows, and the LKL profile boot
#
# Not run: check-lkl-iommu-live needs a QEMU with riscv-iommu-sys, which the
# Ubuntu 24.04 runner (QEMU 8.2) lacks.
name: RTMux + LKL on QEMU

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      lkl_ref:
        description: 'lkl/linux branch, tag or commit (default: HEAD)'
        default: ''

concurrency:
  group: lkl-qemu-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  archives:
    uses: ./.github/workflows/build-lkl.yml
    with:
      lkl_ref: ${{ inputs.lkl_ref || '' }}

  qemu:
    needs: archives
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: containment
            run: make check-lkl-containment check-lkl-floor
          - name: smoke
            run: make check-lkl-qemu
          - name: differential
            run: make check-lkl-differential
          - name: trace
            run: make check-lkl-trace LKL_TRACE_TIMEOUT=900
          - name: profile
            run: make lkl-profile-smoke
    name: qemu (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rtmux
        with:
          lkl: 'true'

      - uses: actions/download-artifact@v8
        with:
          pattern: lkl-rv64-*
          path: lkl-archives

      - name: Install archives
        run: |
          for tarball in lkl-archives/lkl-rv64-*/liblkl-rv64-*.tar.gz; do
            p=${tarball##*/liblkl-rv64-}
            p=${p%.tar.gz}
            mkdir -p "prebuilt/lkl-rv64/out-$p"
            tar xzf "$tarball" -C "prebuilt/lkl-rv64/out-$p"
          done

      - name: Configure (full profile)
        run: make defconfig

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

      - if: failure()
        uses: ./.github/actions/upload-logs
        with:
          name: lkl-qemu-logs-${{ matrix.name }}
          extra: build/lkl-regress/**/*.log
